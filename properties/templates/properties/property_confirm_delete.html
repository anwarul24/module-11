{% extends "base.html" %}
{% block title %}Delete Property{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-danger">
            <div class="card-body p-4">
                <h4>Delete "{{ property.title }}"?</h4>
                <p class="text-muted">This action cannot be undone. All rental requests and reviews for this property will also be removed.</p>
                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">Yes, delete it</button>
                    <a href="{{ property.get_absolute_url }}" class="btn btn-link">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
