{% extends "base.html" %}
{% block title %}Cancel Request{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-warning">
            <div class="card-body p-4">
                <h4>Cancel request for "{{ rental_request.property.title }}"?</h4>
                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">Yes, cancel request</button>
                    <a href="{% url 'rentals:tenant_requests' %}" class="btn btn-link">Back</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
